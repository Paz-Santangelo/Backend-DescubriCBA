spring.application.name=descubri-cba

spring.jpa.database=POSTGRESQL
spring.sql.init.platform=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/descubri_cba
spring.datasource.username=${PSQL_USER}
spring.datasource.password=${PSQL_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.generate-ddl= true
spring.jpa.hibernate.ddl-auto=update

# Aumentar el límite para la subida de archivos
# Tamaño máximo por archivo individual (ej: 10MB)
spring.servlet.multipart.max-file-size=10MB
# Tamaño máximo total de la petición (ej: 100MB)
spring.servlet.multipart.max-request-size=100MB
